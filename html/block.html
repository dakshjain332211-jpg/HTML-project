<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Card Design</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
}

h1{
    background:#b71c1c;
    color:white;
    text-align:center;
    padding:20px;
    font-size:50px;
}

.container{
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
    padding:40px;
}

.card{
    width:320px;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 0 10px rgba(0,0,0,0.3);
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.content{
    padding:20px;
}

.content h2{
    margin-bottom:10px;
}

.content p{
    color:#555;
    margin-bottom:15px;
}

button{
    background:#333;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#b71c1c;
}

@media(max-width:768px){
    h1{
        font-size:32px;
    }

    .card{
        width:90%;
    }
}
</style>

</head>
<body>

<h1>RESPONSIVE CARD DESIGN</h1>

<div class="container">

    <div class="card">
        <img src="https://picsum.photos/400/250?1" alt="">
        <div class="content">
            <h2>Card 1</h2>
            <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit.</p>
            <button>Read More</button>
        </div>
    </div>

    <div class="card">
        <img src="https://picsum.photos/400/250?2" alt="">
        <div class="content">
            <h2>Card 2</h2>
            <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit.</p>
            <button>Read More</button>
        </div>
    </div>

    <div class="card">
        <img src="https://picsum.photos/400/250?3" alt="">
        <div class="content">
            <h2>Card 3</h2>
            <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit.</p>
            <button>Read More</button>
        </div>
    </div>

</div>

</body>
</html>
